<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Calculator App</title>
  <link rel="stylesheet" href="style.css" />
</head>

<body>

  <div class="container">
    <div class="display"><span></span></div>
    <div class="wrapper">
      <div class="card all-clear">AC</div>
      <div class="card clear">C</div>
      <div class="card plus-minus">+/-</div>
      <div class="card percentage">%</div>
      <div class="card card number">0</div>
      <div class="card number">1</div>
      <div class="card number">2</div>
      <div class="card operator">+</div>

      <div class="card number">3</div>
      <div class="card number">4</div>
      <div class="card number">5</div>
      <div class="card operator">-</div>

      <div class="card number">6</div>
      <div class="card number">7</div>
      <div class="card number">8</div>
      <div class="card operator">×</div>

      <div class="card number">9</div>
      <div class="card decimal">.</div>
      <div class="card operator">^</div>
      <div class="card operator">÷</div>

      <div class="card number">π</div>
      <div class="card root">√</div>
      <div class="card factorial">x!</div>
      <div class="card equal-operator">=</div>

    </div>
  <span class="notify"></span>

  </div>
  
</body>
<script src="script.js"></script>
</html>
